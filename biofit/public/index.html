<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym CRM — Biofit</title>
<meta name="theme-color" content="#f26b1d">
<meta name="description" content="Gestão da academia Biofit e portal do aluno">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon-64.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Biofit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#eceef1;--card:#fff;--tx:#16181d;--mut:#667;--bd:#dcdfe4;--pri:#f26b1d;--ok:#12803c;--bad:#c62828;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101215;--card:#1a1d22;--tx:#eef0f3;--mut:#9aa1ab;--bd:#2c3037;--ok:#4ade80;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101215;--card:#1a1d22;--tx:#eef0f3;--mut:#9aa1ab;--bd:#2c3037;--ok:#4ade80;--bad:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px;padding:8px 14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:19px;letter-spacing:-.02em;margin-right:12px}.logo b{color:var(--pri)}
nav{display:flex;gap:2px;flex:1;overflow-x:auto}
.tab{background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--mut);font-weight:600;white-space:nowrap}
.tab.on{background:var(--pri);color:#fff}
main{max-width:1020px;margin:0 auto;padding:18px 14px 40px}
h2{margin:0 0 14px;font-size:24px;letter-spacing:-.02em}
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.bar input{flex:1;min-width:180px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.k{color:var(--mut);font-size:13px}.n{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.n.hot{color:var(--pri)}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:13px;color:var(--mut);font-weight:600}tr:last-child td{border-bottom:0}
tr.late{box-shadow:inset 3px 0 var(--bad)}
.mut{color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}.tag{font-weight:700}
.b{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer}
.b:disabled{opacity:.6;cursor:wait}
.b:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.b.g{background:none;color:var(--tx);border:1px solid var(--bd)}.b.s{padding:4px 9px;font-size:13px}.b.r{background:var(--bad)}
.acts{display:flex;gap:6px}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(440px,92vw);padding:20px}
dialog.larga{width:min(680px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{margin:0 0 6px}
label{display:block;margin-top:10px;font-size:13px;color:var(--mut)}
input,select,textarea{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);margin-top:3px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.err{color:var(--bad);min-height:1.2em;margin:8px 0 0;font-size:14px}
svg text{fill:var(--mut);font-size:12px}svg .v{fill:var(--tx);font-weight:700}svg rect{fill:var(--pri)}
#auth{max-width:340px;margin:12vh auto;padding:0 16px}
#toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
.cards.w{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.cards.m{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}.cards.m .n{font-size:26px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}.seg button{background:none;border:0;padding:7px 12px;cursor:pointer;color:var(--mut);font-weight:600}.seg button.on{background:var(--pri);color:#fff}
.lst{list-style:none;margin:0;padding:0}.lst li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.lst li:last-child{border-bottom:0}
.ck{display:flex;gap:8px;align-items:center;margin-top:6px;color:var(--tx)}.ck input{width:auto;margin:0}
.day{display:flex;flex-direction:column;gap:6px}.day.hoje{border-color:var(--pri);box-shadow:inset 0 3px var(--pri)}.dn{font-weight:800;font-size:17px;line-height:1.2}
.prog{height:8px;border-radius:5px;background:var(--bd);overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--pri)}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:8px}summary{cursor:pointer;font-weight:700}details ul{margin:8px 0 0;padding-left:18px}
.inst{display:none}.inst.on{display:inline-block}
#ios{display:none;margin-top:18px;font-size:13px}#ios.on{display:block}
.ex{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.ex:last-child{border-bottom:0}
.exf{position:relative;width:130px;flex:none}.fig{width:100%;display:block}
.ph{position:absolute;top:0;right:0;font-size:12px;font-weight:700;color:var(--pri);background:rgba(242,107,29,.14);border-radius:6px;padding:1px 7px}
.exi{min-width:0}.exi b{font-size:16px}.exi .k{margin-top:2px}
.exr{border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin-top:8px}.exr2{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.mid img,.mid video{width:100%;border-radius:8px;display:block;background:var(--bg)}
</style>
</head>
<body>
<div id="auth"><p class="mut">Carregando…</p></div>
<div id="app" hidden>
<header>
  <span class="logo">Bio<b>fit</b></span>
  <nav>
    <button class="tab" data-v="dash">Painel</button>
    <button class="tab" data-v="alunos">Alunos</button>
    <button class="tab" data-v="planos">Planos</button>
    <button class="tab" data-v="pags">Pagamentos</button>
    <button class="tab" data-v="treinos">Treinos</button>
    <button class="tab" data-v="valid">Validação</button>
    <button class="tab" data-v="rel">Relatórios</button>
  </nav>
  <button class="b g s inst" onclick="instalar()">Instalar app</button>
  <button class="b g s" onclick="backup()">Backup</button>
  <button class="b g s" onclick="logout()">Sair</button>
</header>
<main id="v"></main>
</div>
<div id="stu" hidden></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
let D={planos:[],alunos:[],pagamentos:[],treinos:[],envios:[]},S=null,papel=null,view='dash';
const R=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const parse=s=>new Date(s+'T00:00:00');
const fd=s=>s?parse(s).toLocaleDateString('pt-BR'):'—';
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2800)}
const B=()=>papel==='aluno'?S:D;
const pl=id=>B().planos.find(p=>p.id==id),al=id=>B().alunos.find(a=>a.id==id),tr=id=>B().treinos.find(t=>t.id==id);

/* ---------- comunicação com o servidor ---------- */
async function api(url,o={}){const opt={method:o.method||(o.body!==undefined?'POST':'GET'),headers:{},credentials:'same-origin'};
  if(o.body!==undefined){if(o.raw){opt.body=o.body;opt.headers['Content-Type']=o.type||'application/octet-stream'}else{opt.body=JSON.stringify(o.body);opt.headers['Content-Type']='application/json'}}
  let r;try{r=await fetch(url,opt)}catch(e){throw new Error('Sem conexão com o servidor. Verifique se o Biofit está rodando.')}
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&!o.publico){toast(j.erro||'Sua sessão expirou.');setTimeout(()=>location.reload(),1200);throw new Error(j.erro||'Sua sessão expirou.')}
  if(!r.ok)throw new Error(j.erro||'Erro '+r.status);return j}
async function refresh(){D=await api('/api/data')}
async function act(fn,msg){try{await fn();await refresh();if(msg)toast(msg);show()}catch(e){toast(e.message)}}

/* ---------- acesso ---------- */
function authUI(novo){$('#auth').hidden=false;
  $('#auth').innerHTML=`<h2 class="logo" style="font-size:30px">Bio<b>fit</b></h2><p class="mut">${novo?'Crie o acesso do administrador para começar.':'Entre para gerenciar a academia.'}</p>
  <form id="fa"><label>E-mail<input id="em" type="email" required autocomplete="username"></label>
  <label>Senha<input id="pw" type="password" required minlength="6" autocomplete="${novo?'new-password':'current-password'}"></label>
  <p class="err" id="ea"></p><button class="b" style="width:100%">${novo?'Criar acesso':'Entrar'}</button></form>${novo?'':'<p style="text-align:center"><button class="b g s" type="button" onclick="stuLogin()">Sou aluno</button></p>'}<p style="text-align:center"><button class="b g s inst" type="button" onclick="instalar()">Instalar app</button></p><p id="ios" class="mut">No iPhone, toque em Compartilhar e depois em “Adicionar à Tela de Início” para instalar o app.</p>`;instUI();
  $('#fa').onsubmit=async e=>{e.preventDefault();const bt=e.submitter;bt.disabled=true;
    try{await api(novo?'/api/admin/criar':'/api/login',{body:{email:$('#em').value.trim(),senha:$('#pw').value},publico:true});papel='admin';await refresh();start()}
    catch(x){$('#ea').textContent=x.message}finally{bt.disabled=false}}}
function start(){$('#auth').hidden=true;$('#stu').hidden=true;$('#app').hidden=false;show()}
async function logout(){try{await api('/api/logout',{method:'POST',publico:true})}catch(e){}location.reload()}

/* ---------- modal ---------- */
function modal(title,body,ok,cb,larga){const d=$('#dlg');d.classList.toggle('larga',!!larga);
  d.innerHTML=`<form><h3>${title}</h3>${body}<p class="err" id="er"></p><div class="row"><button type="button" class="b g" id="cx">${ok?'Cancelar':'Fechar'}</button>${ok?`<button class="b" id="okb">${ok}</button>`:''}</div></form>`;
  d.showModal();$('#cx').onclick=()=>d.close();
  d.querySelector('form').onsubmit=async e=>{e.preventDefault();const bt=$('#okb'),fd=new FormData(e.target);if(bt){bt.disabled=true;bt.dataset.t=bt.textContent;bt.textContent='Salvando…'}
    let r;try{r=await cb(Object.fromEntries(fd),fd)}catch(x){r=x.message}finally{if(bt){bt.disabled=false;bt.textContent=bt.dataset.t}}
    if(r)$('#er').textContent=r;else{d.close();show()}}}
const f=(l,n,v='',a='')=>`<label>${l}<input name="${n}" value="${esc(v)}" ${a}></label>`;
function ask(msg,fn){modal('Confirmar',`<p>${msg}</p>`,'Excluir',async()=>{await fn();await refresh();toast('Excluído')})}
document.addEventListener('input',e=>{if(e.target.name==='cpf'){const d=e.target.value.replace(/\D/g,'').slice(0,11);
  e.target.value=d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')}});

/* ---------- regras ---------- */
function situ(a){if(a.status==='INATIVO')return['Inativo','mut'];return a.venc&&a.venc>=today()?['Em dia','ok']:['Inadimplente','bad']}

/* ---------- telas ---------- */
function show(){if(papel==='aluno')return stuShow();document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===view));
  $('#v').innerHTML=({dash,alunos,planos,pags,treinos,valid,rel})[view]();const n=D.envios.filter(e=>e.status==='PENDENTE').length;document.querySelector('[data-v="valid"]').textContent='Validação'+(n?` (${n})`:'');instUI()}
document.querySelectorAll('.tab').forEach(t=>t.onclick=async()=>{view=t.dataset.v;show();try{await refresh();show()}catch(e){toast(e.message)}});

function dash(){const h=today(),m=h.slice(0,7),A=D.alunos.filter(a=>a.status==='ATIVO');
  const ativos=A.filter(a=>a.venc&&a.venc>=h).length,inad=A.length-ativos,
  fat=D.pagamentos.filter(p=>p.data.startsWith(m)).reduce((s,p)=>s+p.valor,0),novos=D.alunos.filter(a=>a.inicio.startsWith(m)).length;
  const ms=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const k=iso(d).slice(0,7);
    ms.push({l:d.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''),v:D.pagamentos.filter(p=>p.data.startsWith(k)).reduce((s,p)=>s+p.valor,0)})}
  const mx=Math.max(1,...ms.map(x=>x.v));
  const bars=ms.map((x,i)=>{const hh=x.v/mx*120,X=40+i*95;return`<rect x="${X}" y="${150-hh}" width="60" height="${Math.max(hh,2)}" rx="5"/><text class="v" x="${X+30}" y="${142-hh}" text-anchor="middle">${x.v?R.format(x.v):''}</text><text x="${X+30}" y="172" text-anchor="middle">${x.l}</text>`}).join('');
  return`<h2>Painel</h2><div class="cards">
  <div class="box"><div class="k">Receita do mês</div><div class="n hot">${R.format(fat)}</div></div>
  <div class="box"><div class="k">Alunos em dia</div><div class="n">${ativos}</div></div>
  <div class="box"><div class="k">Inadimplentes</div><div class="n ${inad?'bad':''}">${inad}</div></div>
  <div class="box"><div class="k">Novos no mês</div><div class="n">${novos}</div></div></div>
  <div class="box"><div class="k">Receita dos últimos 6 meses</div><svg viewBox="0 0 640 185" style="width:100%" role="img" aria-label="Receita mensal">${bars}</svg></div>`}

function rowsA(q=''){q=q.toLowerCase();return D.alunos.filter(a=>a.nome.toLowerCase().includes(q)||a.cpf.includes(q)).sort((a,b)=>a.nome.localeCompare(b.nome)).map(a=>{const[s,c]=situ(a);
  return`<tr class="${s==='Inadimplente'?'late':''}"><td>${esc(a.nome)}</td><td>${esc(a.cpf)}</td><td>${esc(pl(a.planoId)?.nome||'—')}</td><td>${fd(a.venc)}</td><td class="tag ${c}">${s}</td>
  <td class="acts"><button class="b s" onclick="pg(${a.id})">Pagar</button><button class="b g s" onclick="hist(${a.id})">Histórico</button><button class="b g s" onclick="edA(${a.id})">Editar</button><button class="b g s" onclick="rmA(${a.id})">Excluir</button></td></tr>`}).join('')||'<tr><td colspan="6" class="mut">Nenhum aluno encontrado. Use “Novo aluno” para cadastrar.</td></tr>'}
function alunos(){return`<h2>Alunos</h2><div class="bar"><input placeholder="Buscar por nome ou CPF" oninput="$('#tb').innerHTML=rowsA(this.value)" aria-label="Buscar"><button class="b" onclick="edA()">Novo aluno</button></div>
  <div class="wrap"><table><thead><tr><th>Nome</th><th>CPF</th><th>Plano</th><th>Vencimento</th><th>Situação</th><th></th></tr></thead><tbody id="tb">${rowsA()}</tbody></table></div>`}
function pg(id){const a=al(id),p=pl(a.planoId);if(!p)return toast('Aluno sem plano');
  act(()=>api('/api/pagamentos',{body:{alunoId:id,valor:p.valor}}),'Pagamento de '+R.format(p.valor)+' registrado')}
function edA(id){if(!D.planos.length)return toast('Cadastre um plano primeiro');const a=id?al(id):{nome:'',cpf:'',telefone:'',email:'',planoId:D.planos[0].id,inicio:today(),status:'ATIVO',login:'',rotina:[]};
  const opt=(arr,v)=>arr.map(([k,l])=>`<option value="${k}" ${k==v?'selected':''}>${esc(l)}</option>`).join('');
  modal(id?'Editar aluno':'Novo aluno',f('Nome','nome',a.nome,'required')+f('CPF','cpf',a.cpf,'required inputmode="numeric"')+f('Telefone','telefone',a.telefone,'type="tel"')+f('E-mail','email',a.email,'type="email"')+
  `<label>Plano<select name="planoId">${opt(D.planos.map(p=>[p.id,`${p.nome} — ${R.format(p.valor)}`]),a.planoId)}</select></label>`+f('Início','inicio',a.inicio,'type="date" required')+
  `<label>Status<select name="status">${opt([['ATIVO','Ativo'],['INATIVO','Inativo']],a.status)}</select></label>`+f('Usuário de acesso do aluno','login',a.login||'','autocomplete="off"')+f(id&&a.temSenha?'Nova senha (vazio mantém a atual)':'Senha do aluno','senha','','type="password" minlength="6" autocomplete="new-password"')+`<label>Treinos da rotina</label>`+(D.treinos.map(t=>`<label class="ck"><input type="checkbox" name="rotina" value="${t.id}" ${(a.rotina||[]).includes(t.id)?'checked':''}>${esc(t.nome)}</label>`).join('')||'<p class="mut" style="font-size:13px">Cadastre treinos na aba Treinos.</p>'),'Salvar',async(d,fdata)=>{
    if(d.cpf.replace(/\D/g,'').length!==11)return'CPF deve ter 11 dígitos.';
    const lg=(d.login||'').trim();if(lg&&!a.temSenha&&!(d.senha&&d.senha.length>=6))return'Defina uma senha com 6 ou mais caracteres.';
    const body={nome:d.nome,cpf:d.cpf,telefone:d.telefone,email:d.email,planoId:Number(d.planoId),inicio:d.inicio,status:d.status,login:lg,senha:d.senha||'',rotina:fdata.getAll('rotina').map(Number)};
    await api(id?'/api/alunos/'+id:'/api/alunos',{method:id?'PUT':'POST',body});await refresh();toast('Aluno salvo')})}
function rmA(id){const a=al(id);ask(`Excluir <b>${esc(a.nome)}</b> e o histórico de pagamentos dele?`,()=>api('/api/alunos/'+id,{method:'DELETE'}))}

function planos(){const r=D.planos.map(p=>`<tr><td>${esc(p.nome)}</td><td>${R.format(p.valor)}</td><td>${p.meses} ${p.meses>1?'meses':'mês'}, ${p.freq||3} treinos por semana</td><td>${D.alunos.filter(a=>a.planoId===p.id).length}</td>
  <td class="acts"><button class="b g s" onclick="edP(${p.id})">Editar</button><button class="b g s" onclick="rmP(${p.id})">Excluir</button></td></tr>`).join('')||'<tr><td colspan="5" class="mut">Nenhum plano. Crie o primeiro com “Novo plano”.</td></tr>';
  return`<h2>Planos</h2><div class="bar"><button class="b" onclick="edP()">Novo plano</button></div><div class="wrap"><table><thead><tr><th>Nome</th><th>Valor</th><th>Duração</th><th>Alunos</th><th></th></tr></thead><tbody>${r}</tbody></table></div>`}
function edP(id){const p=id?pl(id):{nome:'',valor:'',meses:1,freq:3};
  modal(id?'Editar plano':'Novo plano',f('Nome','nome',p.nome,'required')+f('Valor (R$)','valor',p.valor,'type="number" min="0.01" step="0.01" required')+f('Duração (meses)','meses',p.meses,'type="number" min="1" max="36" step="1" required')+f('Treinos por semana','freq',p.freq||3,'type="number" min="1" max="7" step="1" required'),'Salvar',async d=>{
    await api(id?'/api/planos/'+id:'/api/planos',{method:id?'PUT':'POST',body:{nome:d.nome,valor:Number(d.valor),meses:Number(d.meses),freq:Number(d.freq)}});await refresh();toast('Plano salvo')})}
function rmP(id){const u=D.alunos.filter(a=>a.planoId===id).length;if(u)return toast(`Plano em uso por ${u} aluno(s). Mude o plano deles antes.`);ask('Excluir este plano?',()=>api('/api/planos/'+id,{method:'DELETE'}))}

function pags(){const r=[...D.pagamentos].sort((a,b)=>b.data.localeCompare(a.data)||b.id-a.id).map(p=>`<tr><td>${fd(p.data)}</td><td>${esc(al(p.alunoId)?.nome||'—')}</td><td>${R.format(p.valor)}</td><td class="tag ok">${p.status==='PAGO'?'Pago':esc(p.status)}</td></tr>`).join('')||'<tr><td colspan="4" class="mut">Nenhum pagamento ainda. Registre o primeiro com “Novo pagamento”.</td></tr>';

const NSV='http://www.w3.org/2000/svg',ANREG=new Set(),anStill=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);

function anDraw(el){const c=el._an,r=c.A.f(c.t),gb=el.querySelector('.gb'),gd=el.querySelector('.gd');
  while(c.paths.length<r.lines.length){const p=document.createElementNS(NSV,'path');p.setAttribute('fill','none');p.setAttribute('stroke','var(--tx)');p.setAttribute('stroke-width','5');p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');gb.insertBefore(p,c.head);c.paths.push(p)}
  r.lines.forEach((l,i)=>{const p=c.paths[i];p.setAttribute('d','M'+l.p.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join('L'));p.setAttribute('opacity',l.c==='far'?'0.4':'1')});
  c.head.setAttribute('cx',r.head[0].toFixed(1));c.head.setAttribute('cy',r.head[1].toFixed(1));c.head.setAttribute('r',r.head[2]);
  while(c.dots.length<r.dots.length){const d=document.createElementNS(NSV,'circle');d.setAttribute('r','4.5');d.setAttribute('fill','#f26b1d');gd.appendChild(d);c.dots.push(d)}
  r.dots.forEach((d,i)=>{c.dots[i].setAttribute('cx',d[0].toFixed(1));c.dots[i].setAttribute('cy',d[1].toFixed(1))});
  const l=c.A.lb(c.t);if(l!==c.lab){c.lab=l;if(c.ph)c.ph.textContent=l}}

/* ---------- frequência, sequência e histórico ---------- */
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
function range(a,b){const r=[];for(let d=a;d<=b;d=addD(d,1))r.push(d);return r}
const hojeRef=()=>papel==='aluno'?S.hoje:today();
function slot(a,date){const p=pl(a.planoId);if(!p)return;
  const days=PAT[Math.min(7,Math.max(1,p.freq||3))],i=days.indexOf(parse(date).getDay());
  if(i<0)return;                       // dia de descanso
  const r=a.rotina||[];return{t:r.length?tr(r[i%r.length]):null}}
let _ix=null,_ixDe=null;
function envOf(a,date){const src=B().envios;if(_ixDe!==src){_ix=new Map();for(const e of src){const k=e.alunoId+'|'+e.data;if(!_ix.has(k))_ix.set(k,[]);_ix.get(k).push(e)}_ixDe=src}
  const l=_ix.get(a.id+'|'+date)||[];return l.find(e=>e.status==='APROVADO')||l.find(e=>e.status==='PENDENTE')||l[l.length-1]}
function freq(a,from,to){const s=from<a.inicio?a.inicio:from;if(s>to)return{prev:0,ok:0,pct:null};
  let prev=0,ok=0;range(s,to).forEach(d=>{if(slot(a,d)){prev++;if(envOf(a,d)?.status==='APROVADO')ok++}});
  return{prev,ok,pct:prev?Math.round(ok/prev*100):null}}
function streak(a,h){let n=0;for(let d=h,k=0;k<730&&d>=a.inicio;k++,d=addD(d,-1)){if(!slot(a,d))continue;
  if(envOf(a,d)?.status==='APROVADO')n++;else if(d!==h)break}return n}
const aprovados=a=>B().envios.filter(e=>e.alunoId===a.id&&e.status==='APROVADO');
function resumo(a,h){const ap=aprovados(a);return{f:freq(a,addD(h,-27),h),seq:streak(a,h),total:ap.length,ult:ap.map(e=>e.data).sort().pop()||null}}
function semanas(a,h,n=8){const seg=addD(h,-((parse(h).getDay()+6)%7));const W=[];for(let k=n-1;k>=0;k--){const ini=addD(seg,-7*k),fim=k?addD(ini,6):h;W.push({ini,...freq(a,ini,fim)})}return W}
const STE={APROVADO:['Validado','ok'],PENDENTE:['Em análise',''],REJEITADO:['Rejeitado','bad']};
function histHTML(a,h,admin){const r=resumo(a,h),W=semanas(a,h);

  const Pg=admin?B().pagamentos.filter(p=>p.alunoId===a.id).sort((x,y)=>y.data.localeCompare(x.data)||y.id-x.id).slice(0,5).map(p=>`<li><span>${fd(p.data)} · ${esc(pl(p.planoId??a.planoId)?.nome||'—')}</span><b>${R.format(p.valor)}</b></li>`).join('')||'<li class="mut">Nenhum pagamento.</li>':'';

let per=30;

  const A=D.alunos.filter(a=>a.status==='ATIVO').map(a=>({a,f:freq(a,from,h),ult:aprovados(a).map(e=>e.data).sort().pop()||null}));

  const P=D.pagamentos.filter(p=>p.data>=from&&p.data<=h),G=new Map();
  for(const p of P){const id=p.planoId??al(p.alunoId)?.planoId??0,g=G.get(id)||{nome:pl(id)?.nome||'Sem plano',n:0,v:0};g.n++;g.v+=p.valor;G.set(id,g)}
  return{h,from,A,P,G:[...G.values()].sort((x,y)=>y.v-x.v)}}

  const gp=G.map(g=>`<tr><td>${esc(g.nome)}</td><td>${g.n}</td><td>${R.format(g.v)}</td></tr>`).join('')||'<tr><td colspan="3" class="mut">Nenhum pagamento no período.</td></tr>';
  return`<h2>Relatórios</h2><div class="bar" style="align-items:center"><div class="seg">${[7,30,90].map(n=>`<button class="${n===per?'on':''}" onclick="per=${n};show()">${n} dias</button>`).join('')}</div><span class="mut" style="flex:1">${fd(from)} a ${fd(h)}</span><button class="b g" onclick="csv()">Exportar CSV</button></div>
  <div class="cards"><div class="box"><div class="k">Frequência média</div><div class="n hot">${media===null?'—':media+'%'}</div><div class="k">alunos ativos com treino previsto</div></div>
  <div class="box"><div class="k">Abaixo de 50%</div><div class="n ${baixo?'bad':''}">${baixo}</div><div class="k">alunos para contatar</div></div>
  <div class="box"><div class="k">Receita do período</div><div class="n">${R.format(rec)}</div></div>
  <div class="box"><div class="k">Aguardando análise</div><div class="n">${pend}</div><div class="k">envios pendentes</div></div></div>
  <h2 style="font-size:18px">Frequência por aluno</h2><div class="wrap" style="margin-bottom:16px"><table><thead><tr><th>Aluno</th><th>Plano</th><th>Previstos</th><th>Validados</th><th>Frequência</th><th>Último treino</th><th>Vencimento</th><th>Situação</th></tr></thead><tbody>${linhas}</tbody></table></div>
  <h2 style="font-size:18px">Receita por plano</h2><div class="wrap"><table style="min-width:360px"><thead><tr><th>Plano</th><th>Pagamentos</th><th>Total</th></tr></thead><tbody>${gp}</tbody></table></div>`}
function csv(){const{from,h,A}=relDados();
  const cel=v=>{let s=String(v??'');if(/^[=+\-@]/.test(s))s="'"+s;return/[;"\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const rows=[['Aluno','CPF','Plano','Previstos','Validados','Frequência (%)','Último treino','Vencimento','Situação'],...A.map(({a,f,ult})=>[a.nome,a.cpf,pl(a.planoId)?.nome||'',f.prev,f.ok,f.pct??'',ult?fd(ult):'',a.venc?fd(a.venc):'',situ(a)[0]])];
  const t='﻿'+rows.map(r=>r.map(cel).join(';')).join('\r\n'),u=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'})),el=document.createElement('a');
  el.href=u;el.download=`biofit-frequencia-${from}-a-${h}.csv`;document.body.append(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Relatório exportado')}

/* ---------- portal do aluno ---------- */
function stuLogin(){$('#auth').innerHTML=`<h2 class="logo" style="font-size:30px">Bio<b>fit</b></h2><p class="mut">Acesso do aluno.</p><form id="fs"><label>Usuário<input id="su" required autocomplete="username" autocapitalize="none"></label><label>Senha<input id="sp" type="password" required autocomplete="current-password"></label><p class="err" id="ea"></p><button class="b" style="width:100%">Entrar</button></form><p style="text-align:center"><button class="b g s" type="button" onclick="authUI(false)">Voltar</button></p><p style="text-align:center"><button class="b g s inst" type="button" onclick="instalar()">Instalar app</button></p><p id="ios" class="mut">No iPhone, toque em Compartilhar e depois em “Adicionar à Tela de Início” para instalar o app.</p>`;instUI();
  $('#fs').onsubmit=async e=>{e.preventDefault();const bt=e.submitter;bt.disabled=true;
    try{await api('/api/aluno/login',{body:{login:$('#su').value.trim(),senha:$('#sp').value},publico:true});await stuStart()}catch(x){$('#ea').textContent=x.message}finally{bt.disabled=false}}}
async function carregaS(){S=await api('/api/aluno/eu');S.planos=S.plano?[S.plano]:[];S.alunos=[S.aluno]}
async function stuStart(){papel='aluno';await carregaS();$('#auth').hidden=true;$('#app').hidden=true;$('#stu').hidden=false;stuShow()}
function stuShow(){const a=S.aluno,p=S.plano,h=S.hoje,late=!a.venc||a.venc<h,wk=S.semana;
  const sl=wk.map(d=>slot(a,d)),tot=sl.filter(Boolean).length,ok=wk.filter((d,i)=>sl[i]&&envOf(a,d)?.status==='APROVADO').length;
  const days=wk.map((d,i)=>{const s=sl[i],e=envOf(a,d);let st,b='';
    if(!s)st='<span class="mut">Descanso</span>';
    else if(e&&e.status==='APROVADO')st='<span class="tag ok">Validado</span>';
    else if(e&&e.status==='PENDENTE')st='<span class="tag" style="color:var(--pri)">Em análise</span>';
    else{st=e?'<span class="tag bad">Rejeitado, envie outro</span>':d<h?'<span class="tag bad">Não enviado</span>':d===h?'<span class="mut">Aguardando sua prova</span>':'<span class="mut">Em breve</span>';if(d<=h&&!late&&d>=a.inicio)b=`<button class="b s" onclick="env('${d}')">Enviar foto ou vídeo</button>`}
    return`<div class="box day ${d===h?'hoje':''}"><div class="k">${DN[parse(d).getDay()]}, ${d.slice(8)}/${d.slice(5,7)}</div><div class="dn">${s?esc(s.t?.nome||'Treino a definir'):'—'}</div>${st}${b}</div>`}).join('');
  const L=S.treinos.map(t=>`<details><summary>${esc(t.nome)} (${t.ex.length} ${t.ex.length===1?'exercício':'exercícios'})</summary>${exList(t)}</details>`).join('')||'<p class="mut">Seu instrutor ainda não definiu seus treinos.</p>';
  $('#stu').innerHTML=`<header><span class="logo">Bio<b>fit</b></span><span class="mut" style="flex:1">Olá, ${esc(a.nome.split(' ')[0])}</span><button class="b g s inst" onclick="instalar()">Instalar app</button><button class="b g s" onclick="logout()">Sair</button></header><main><h2>Minha semana</h2>${late?`<div class="box bad" style="margin-bottom:14px">Seu plano venceu em ${fd(a.venc)}. Procure a recepção para renovar e voltar a enviar treinos.</div>`:''}
  <div class="box" style="margin-bottom:14px"><div class="k">Plano ${esc(p?.nome||'—')}, ${p?.freq||3} treinos por semana. Vence em ${fd(a.venc)}.</div><div class="n">${ok} de ${tot} <span class="k">validados nesta semana</span></div><div class="prog"><i style="width:${tot?ok/tot*100:0}%"></i></div></div>
  <div class="cards">${days}</div><h2 style="margin-top:22px">Meu histórico</h2>${histHTML(a,h)}<h2 style="margin-top:22px">Meus treinos</h2>${L}</main>`;startAnims($('#stu'));instUI()}
function env(d){modal('Enviar prova do treino',`<p class="mut" style="font-size:14px">Treino de ${fd(d)}. Escolha uma foto ou um vídeo, até 50 MB.</p><label>Arquivo<input type="file" name="file" accept="image/*,video/*" required></label>`,'Enviar',async x=>{const fl=x.file;
  if(!fl||!fl.size)return'Escolha um arquivo.';if(!/^(image|video)\//.test(fl.type))return'Envie uma foto ou um vídeo.';if(fl.size>50*2**20)return'Arquivo acima de 50 MB.';
  await api('/api/envios?data='+d,{method:'POST',raw:true,body:fl,type:fl.type});await carregaS();toast('Enviado para análise')})}

/* ---------- backup ---------- */
async function backup(){let j;try{j=await api('/api/backup')}catch(e){return toast(e.message)}const t=JSON.stringify(j);
  modal('Backup dos dados',`<p class="mut" style="font-size:14px">Os dados ficam no banco de dados do servidor, na pasta <b>dados</b>. Copie o texto abaixo ou baixe o arquivo para guardar uma cópia.</p><p class="mut" style="font-size:14px">Para restaurar, ou para trazer os dados da versão antiga do Biofit, cole o backup aqui e clique em Restaurar. <b>Restaurar substitui todos os dados atuais.</b> Para guardar também as fotos e vídeos, copie a pasta <b>dados</b> inteira.</p><textarea name="j" rows="8" spellcheck="false">${esc(t)}</textarea><p><button type="button" class="b g s" id="dl">Baixar arquivo de backup</button></p>`,'Restaurar',async d=>{
    let n;try{n=JSON.parse(d.j)}catch(e){return'Texto de backup inválido.'}await api('/api/backup',{body:{dados:n}});await refresh();toast('Dados restaurados')});
  $('#dl').onclick=()=>{const u=URL.createObjectURL(new Blob([t],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='biofit-backup-'+today()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}}

/* ---------- app instalável (PWA) ---------- */
let instEvt=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const ehIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function instUI(){document.querySelectorAll('.inst').forEach(b=>b.classList.toggle('on',!!instEvt&&!standalone()));const i=$('#ios');if(i)i.classList.toggle('on',ehIOS&&!standalone())}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEvt=e;instUI()});
addEventListener('appinstalled',()=>{instEvt=null;instUI();toast('App instalado')});
async function instalar(){if(!instEvt)return;instEvt.prompt();try{await instEvt.userChoice}catch(e){}instEvt=null;instUI()}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
addEventListener('online',()=>toast('Conexão restabelecida'));addEventListener('offline',()=>toast('Você está sem internet'));

/* ---------- início ---------- */
(async()=>{let s;try{s=await api('/api/status',{publico:true})}catch(e){$('#auth').innerHTML=`<h2 class="logo" style="font-size:30px">Bio<b>fit</b></h2><p class="err">${esc(e.message)}</p>`;return}
  try{if(s.me?.papel==='admin'){papel='admin';await refresh();return start()}if(s.me?.papel==='aluno')return await stuStart()}catch(e){}
  authUI(!s.temAdmin)})();
</script>
</body>
</html>
